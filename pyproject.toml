[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deepanepose"
version = "0.1.0"
description = "Intracranial aneurysm pose estimation (position, size and orientation) from 3D TOF-MRA (MICCAI 2023)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Youssef Assis" }]
dependencies = [
    "joblib",
    "matplotlib",
    "nibabel",
    "numpy",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "SimpleITK",
    "tensorboard",
    "tensorboardX",
    "torch>=2.3",
    "tqdm",
]

[project.optional-dependencies]
# PyTorch build, for uv: `uv sync --extra cpu` or `uv sync --extra cu126` (see [tool.uv.sources])
cpu = ["torch>=2.3"]
cu126 = ["torch>=2.3"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
include = ["deepanepose*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# ruff's default rules: pycodestyle errors and pyflakes
select = ["E4", "E7", "E9", "F"]
